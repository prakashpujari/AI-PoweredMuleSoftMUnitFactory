apiVersion: apps/v1
kind: Deployment
metadata:
  name: munit-api
  namespace: munit-factory
  labels:
    app: munit-api
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: munit-api
  template:
    metadata:
      labels:
        app: munit-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: munit-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: ai-munit-factory-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: munit-factory-config
            - secretRef:
                name: munit-factory-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: repos
              mountPath: /repos
              readOnly: true
            - name: reports
              mountPath: /reports
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: repos-pvc
        - name: reports
          persistentVolumeClaim:
            claimName: reports-pvc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: munit-api-service
  namespace: munit-factory
  labels:
    app: munit-api
spec:
  selector:
    app: munit-api
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: munit-api-hpa
  namespace: munit-factory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: munit-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
