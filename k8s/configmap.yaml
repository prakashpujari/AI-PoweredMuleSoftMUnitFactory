apiVersion: v1
kind: ConfigMap
metadata:
  name: munit-factory-config
  namespace: munit-factory
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  API_PREFIX: "/api/v1"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  DEFAULT_AI_PROVIDER: "groq"
  COVERAGE_TARGET_PERCENT: "95.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
