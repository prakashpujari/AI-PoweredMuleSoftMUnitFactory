apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: munit-factory-ingress
  namespace: munit-factory
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - munit-factory.example.com
      secretName: munit-factory-tls
  rules:
    - host: munit-factory.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: munit-api-service
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: munit-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: munit-frontend-service
                port:
                  number: 80
