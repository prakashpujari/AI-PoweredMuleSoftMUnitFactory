apiVersion: apps/v1
kind: Deployment
metadata:
  name: munit-frontend
  namespace: munit-factory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: munit-frontend
  template:
    metadata:
      labels:
        app: munit-frontend
    spec:
      containers:
        - name: frontend
          image: ai-munit-factory-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: munit-frontend-service
  namespace: munit-factory
spec:
  selector:
    app: munit-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
