[project]
name = "ai-munit-factory"
version = "1.0.0"
description = "AI-powered MuleSoft MUnit test generation and analysis platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N806"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*", "tests/*"]

[tool.coverage.report]
skip_covered = false
show_missing = true
